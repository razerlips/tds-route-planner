<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6f7a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230d6f7a%27/%3E%3Cpath d=%27M5 21c3-3 5-3 8 0s5 3 8 0 5-3 6-1%27 stroke=%27white%27 stroke-width=%272.5%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2716%27 cy=%2711%27 r=%273.5%27 fill=%27%23e2b25e%27/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>シー周遊プランナー</title>
<meta name="description" content="ショー時刻・待ち時間・徒歩距離から、東京ディズニーシーの1日の回り方を組み立てる非公式プランナー">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: モバイルは下タブ（えらぶ／プラン／マップ）で1画面ずつ。960px以上は左にリスト、右にプラン＋マップ */
:root{
  --bg:#edf2f3; --surface:#ffffff; --surface2:#f4f7f8; --ink:#12262e; --muted:#5b7078; --line:#d5dfe2;
  --sea:#0d6f7a; --sea-soft:#d8ecee; --brass:#9e6c1c; --brass-soft:#f4e7cf; --warn:#b3412e; --warn-soft:#f8e1db; --ok:#2f7d4f; --ok-soft:#dcefe3;
  --shadow:0 10px 30px rgb(18 38 46 / .16);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a161a; --surface:#11222a; --surface2:#0e1d23; --ink:#e3eef0; --muted:#94aab1; --line:#243a41;
  --sea:#4cc0c9; --sea-soft:#15393e; --brass:#e2b25e; --brass-soft:#3a2f1b; --warn:#f08a74; --warn-soft:#3d211c; --ok:#6fcf95; --ok-soft:#183427;
  --shadow:0 10px 30px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a161a; --surface:#11222a; --surface2:#0e1d23; --ink:#e3eef0; --muted:#94aab1; --line:#243a41;
  --sea:#4cc0c9; --sea-soft:#15393e; --brass:#e2b25e; --brass-soft:#3a2f1b; --warn:#f08a74; --warn-soft:#3d211c; --ok:#6fcf95; --ok-soft:#183427;
  --shadow:0 10px 30px rgb(0 0 0 / .5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;letter-spacing:.02em;line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-btn:hover{border-color:var(--sea)}
.pill-btn.primary{background:var(--sea);border-color:var(--sea);color:var(--surface)}

/* メイン */
.main{max-width:1200px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pane{min-width:0}
.pane-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.pane-h h2{font-family:var(--f-display);font-size:18px;margin:0}
.pane-h span{font-size:12px;color:var(--muted)}
@media (max-width:959px){
  .pane{display:none}
  body[data-tab="pick"] #pane-pick, body[data-tab="plan"] #pane-plan, body[data-tab="map"] #pane-map{display:block}
}
@media (min-width:960px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);grid-template-areas:"pick plan" "pick map";gap:16px 24px;align-items:start;padding-bottom:40px}
  #pane-pick{grid-area:pick;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px}
  #pane-plan{grid-area:plan} #pane-map{grid-area:map}
  .tabs{display:none!important}
}

/* 下タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:none;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--sea)}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--sea);color:var(--surface);font-size:10px;border-radius:99px;padding:0 6px;font-family:var(--f-mono)}

/* えらぶ */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{position:relative}
.search input{padding-left:34px;border-radius:99px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.paste-cta{display:flex;align-items:center;gap:12px;background:var(--brass-soft);border:1px dashed var(--brass);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.paste-cta b{display:block;font-size:14px;color:var(--brass)}
.paste-cta span{font-size:12px;color:var(--muted)}
.area{margin-top:14px}
.area summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;cursor:pointer;padding:4px 0}
.area summary::-webkit-details-marker{display:none}
.area summary .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.area summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 2px}
.area[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px}
.row.on{border-color:var(--sea);background:var(--sea-soft)}
.tog{flex:none;width:40px;height:40px;border:none;background:none;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.tog i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.row.on .tog i{background:var(--sea);border-color:var(--sea)}
.row.on .tog i::after{content:"";width:6px;height:11px;border-right:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(45deg) translate(-1px,-1px)}
.row-body{flex:1;min-width:0;border:none;background:none;text-align:left;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column}
.rn{font-weight:700;font-size:14px;line-height:1.35}
.rm{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:1px}
.rm .hot{color:var(--brass);font-weight:700}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);margin-right:8px}
.kind{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;font-weight:700}
.kind.show{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.kind.meal{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.kind.greet,.kind.shop{background:var(--sea-soft);color:var(--sea);border-color:transparent}
.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
.foot-note{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6}

/* プラン */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface2);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.alert b{display:block;margin-bottom:2px}
.tl{margin-top:12px;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;position:relative}
.ev .t{font-family:var(--f-mono);font-weight:600;font-size:14px;padding-top:10px;font-variant-numeric:tabular-nums}
.ev-card{border:none;text-align:left;width:100%;background:var(--surface2);border-radius:12px;padding:9px 12px;border-left:4px solid var(--sea);cursor:pointer;display:block;margin:3px 0}
.ev-card:hover{background:var(--sea-soft)}
.ev.show .ev-card{border-left-color:var(--brass)}
.ev.meal .ev-card{border-left-color:var(--ok)}
.ev.greet .ev-card,.ev.shop .ev-card{border-left-style:double;border-left-width:5px}
.ev.free .ev-card{background:none;border-left:2px dotted var(--line);color:var(--muted);cursor:default;font-size:13px;padding:6px 12px}
.ev .n{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .d{font-size:12.5px;color:var(--muted)}
.ev .num{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--sea);color:var(--surface);font-size:11px;font-family:var(--f-mono)}
.ev.show .num{background:var(--brass)} .ev.meal .num{background:var(--ok)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:700;white-space:nowrap}
.tag.lock{background:var(--ink);color:var(--bg)}
.tag.gold{background:var(--brass-soft);color:var(--brass)}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.ev.now .ev-card{box-shadow:0 0 0 2px var(--warn)}
.now-tag{background:var(--warn);color:var(--surface)}
.walk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:12px;color:var(--muted)}
.walk div:last-child{border-left:2px dashed var(--line);margin-left:10px;padding:3px 0 3px 12px}
.late{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:4px 8px;font-size:12px;margin-top:6px}

/* マップ */
.map svg{width:100%;max-width:520px;display:block;margin:0 auto}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;margin-top:12px;font-size:12.5px}
.legend div{display:flex;gap:6px;align-items:baseline;min-width:0}
.legend b{font-family:var(--f-mono);color:var(--sea)}
@media (min-width:960px){#pane-map .pane-h{display:none}}

/* シート */
.sheet-root{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgb(6 16 20 / .45)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:8px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
@media (min-width:960px){.sheet-root{align-items:center}.sheet{border-radius:20px;padding-bottom:20px}.grab{display:none}}
.sh-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.sh-head h3{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.3;flex:1;text-wrap:balance}
.sh-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px;line-height:1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.fld small{font-weight:400;letter-spacing:0}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink)}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;padding:0;border:none;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw input:checked{background:var(--sea)}
.sw input:checked::after{left:21px}
.sw span small{display:block;color:var(--muted);font-size:11.5px}
.sw.disabled{opacity:.55}
.timechips{display:flex;flex-wrap:wrap;gap:6px}
.timechips button{font-family:var(--f-mono);border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px}
.timechips button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.timechips button:disabled{cursor:not-allowed;opacity:.6}
.big-toggle{width:100%;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;border:1px solid var(--sea);background:var(--sea);color:var(--surface);margin-bottom:14px}
.big-toggle.off{background:transparent;color:var(--sea)}
.info{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px}
.sh-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.danger{color:var(--warn);border-color:var(--warn)}
textarea{min-height:170px;font-size:14px;line-height:1.5;resize:vertical}
.results{margin-top:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.results div{padding:6px 10px;border-radius:8px;background:var(--surface2)}
.results .ok{background:var(--ok-soft);color:var(--ok)}
.results .new{background:var(--brass-soft);color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;z-index:80;box-shadow:var(--shadow);white-space:nowrap}
@media (min-width:960px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>シー周遊プランナー</h1><p id="hdr-sub"></p></div>
    <button class="pill-btn" id="btn-settings" type="button" aria-label="設定">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      日付・設定</button>
  </div>
</header>

<main class="main">
  <section class="pane" id="pane-pick" aria-label="行きたいものを選ぶ">
    <div class="pane-h"><h2>行きたいもの</h2><span id="pick-count"></span></div>
    <div class="toolbar">
      <button class="paste-cta" id="btn-paste" type="button">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--brass);flex:none"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg>
        <span><b>当日のショー時刻を貼り付けて取り込む</b><span>公式サイトの「パレード/ショー」「グリーティング」をコピーして貼るだけ</span></span>
      </button>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="名前で探す（例：ソアリン）" aria-label="名前で探す"></label>
      <div class="chips" id="chips" role="group" aria-label="絞り込み"></div>
    </div>
    <div id="list"></div>
    <div class="actions"><button class="pill-btn" id="btn-add" type="button">＋ 自分で追加（レストラン・ショップなど）</button></div>
    <p class="foot-note">非公式のファン製ツールです。東京ディズニーリゾートの公式サービスとは関係ありません。待ち時間・所要時間・場所は目安なので、当日の公式アプリの情報で上書きしてください。徒歩距離は位置関係から概算しています。</p>
  </section>

  <section class="pane" id="pane-plan" aria-label="1日のプラン">
    <div class="card">
      <div class="pane-h"><h2>1日のプラン</h2><span id="plan-date"></span></div>
      <div class="stats" id="stats"></div>
      <div id="alerts"></div>
      <div class="actions">
        <button class="pill-btn" id="btn-copy" type="button">テキストでコピー</button>
      </div>
      <div class="tl" id="tl"></div>
    </div>
  </section>

  <section class="pane" id="pane-map" aria-label="ルートマップ">
    <div class="card map">
      <div class="pane-h"><h2>ルートマップ</h2><span>位置関係の模式図</span></div>
      <div id="map"></div>

  {id:'g-donald',name:'ミッキー＆フレンズ・グリーティングトレイル（ドナルド）',area:'lrd',x:190,y:830,dur:5,wait:40,type:'greet',wins:[['09:30','20:00']],est:true},
  {id:'g-plaza',name:'ディズニーシー・プラザ（キャラクターグリーティング）',area:'med',x:0,y:70,dur:5,wait:30,type:'greet',wins:[['09:15','10:15'],['12:00','13:50']],note:'定員に達すると時間内でも終了することがあります',est:true},
  {id:'g-village',name:'ケープコッドでお買い物（ダッフィーのショップ）',area:'awf',x:215,y:430,dur:25,wait:0,type:'shop',est:true},

  {id:'dinner',name:'ディナー',area:'awf',x:250,y:230,dur:60,type:'meal',times:['17:30']}

const SAMPLE={tsm:{first:true,wait:60},soarin:{prio:true},turtle:{},'20k':{after:'lunch'},frozen:{fixed:'15:00'},indy:{},center:{},
  sjc:{pick:'14:00'},dtg:{pick:'16:55'},believe:{},lunch:{},dinner:{}};

/* ================= 状態 ================= */
const KEY='sea-planner-v1', UIKEY='sea-planner-ui';
function nextMonthISO(){const d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,10)}
function defaults(){
  const s={v:13,settings:{date:nextMonthISO(),open:'09:00',close:'21:00',speed:60,buffer:15},items:{},custom:[]};
  for(const[k,v]of Object.entries(SAMPLE))s.items[k]={sel:true,...v};
  return s;
}
let state=null;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.settings||!state.items)state=defaults();
state.custom=state.custom||[];state.v=13;
let ui={tab:'pick',filter:'all',q:''};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(e){}
ui.q='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(UIKEY,JSON.stringify({tab:ui.tab,filter:ui.filter}))}catch(e){}}

const allItems=()=>[...BASE,...state.custom];
const byId=id=>allItems().find(i=>i.id===id);
const typeOf=it=>it.type||'ride';
function st(it){
  const s=state.items[it.id]||(state.items[it.id]={});
  if(s.wait==null)s.wait=it.wait??0;
  if(s.dur==null)s.dur=it.dur;
  if(!s.area)s.area=it.area;
  const t=typeOf(it);
  if(t==='show'||t==='meal'){if(s.times==null)s.times=(it.times||[]).join(',');if(s.pick==null)s.pick=(it.times||[])[0]||'';}
  return s;
}
const restOf=s=>s&&s.rest?RESTS.find(r=>r.id===s.rest):null;
const winsOf=(it,s)=>s.wins||it.wins||null;
const timesOf=s=>(s.times||'').split(/[,、\s]+/).map(normT).filter(Boolean);
function normT(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?String(+m[1]).padStart(2,'0')+':'+m[2]:''}
const toMin=t=>{t=normT(t);if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hyp=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function dist(a,b){const fa=a.area==='fs',fb=b.area==='fs';return((fa!==fb)?hyp(a,FS_GATE)+hyp(FS_GATE,b):hyp(a,b))*1.3}
function locOf(it,s){
  const R=restOf(s);if(R)return{x:R.x,y:R.y,area:R.area};
  if(s.area&&s.area!==it.area&&AREAS[s.area])return{x:AREAS[s.area].x,y:AREAS[s.area].y,area:s.area};
  return{x:it.x,y:it.y,area:it.area};
}
function hasTime(it,s){const t=typeOf(it);return t==='ride'?!!normT(s.fixed):(t==='show'||t==='meal')?!!normT(s.pick):false}

/* ================= スケジューラ ================= */
function plan(){
  const S=state.settings,speed=+S.speed||60,buf=+S.buffer||0;
  const open=toMin(S.open)??540,close=toMin(S.close)??1260;
  const walkMin=(a,b)=>dist(a,b)/speed;
  const fixed=[],flex=[];
  for(const it of allItems()){
    const s=st(it);if(!s.sel)continue;
    const type=typeOf(it),o={it,s,type,...locOf(it,s),wins:winsOf(it,s)};
    if(type==='ride'||type==='greet'||type==='shop'){
      const f=type==='ride'?toMin(s.fixed):null;
      if(f!=null){o.start=f;o.lead=0;o.len=Math.min(+s.wait||0,10)+(+s.dur||0);o.dpa=true;fixed.push(o)}
      else{o.cost=(+s.wait||0)+(+s.dur||0);flex.push(o)}
    }else{
      const f=toMin(s.pick);if(f==null){flex.push({...o,noTime:true});continue}
      o.start=f;o.lead=type==='show'?buf:0;o.len=+s.dur||0;fixed.push(o);
    }
  }
  fixed.sort((a,b)=>a.start-b.start);
  const steps=[];let t=open,pos=ENT,walkTotal=0,waitTotal=0,fi=0;
  const done=new Set();
  let rem=flex.filter(f=>!f.noTime);
  const addWalk=to=>{const d=dist(pos,to),m=d/speed;if(d>20){steps.push({k:'walk',start:t,d,m});walkTotal+=d}t+=m;pos=to};
  while(true){
    const nx=fixed[fi];
    const startAt=c=>{
      let a=t+walkMin(pos,c);
      if(c.wins){let ok=null;for(const[w0,w1]of c.wins){const s0=Math.max(a,toMin(w0));if(s0-a<=20&&s0+c.cost<=toMin(w1)){ok=s0;break}}if(ok==null)return null;a=ok}
      const end=a+c.cost;
      return(nx?end+walkMin(c,nx)<=nx.start-nx.lead:end<=close)?a:null;
    };
    const afterOk=c=>!c.s.after||done.has(c.s.after)||!(state.items[c.s.after]||{}).sel;
    let cand=rem.filter(c=>afterOk(c)&&startAt(c)!=null);
    if(cand.some(c=>c.s.first))cand=cand.filter(c=>c.s.first);
    else if(cand.some(c=>c.s.prio))cand=cand.filter(c=>c.s.prio);
    if(cand.length){
      cand.sort((a,b)=>(walkMin(pos,a)+a.s.wait*0.15)-(walkMin(pos,b)+b.s.wait*0.15));
      const c=cand[0];rem=rem.filter(r=>r!==c);done.add(c.it.id);
      const s0=startAt(c);addWalk(c);
      if(s0>t+0.5){steps.push({k:'free',start:t,end:s0});t=s0}
      const w=+c.s.wait||0;waitTotal+=w;
      steps.push({k:c.type,o:c,start:t,mid:t+w,end:t+w+(+c.s.dur||0)});
      t+=w+(+c.s.dur||0);continue;
    }
    if(!nx)break;
    addWalk(nx);
    const need=nx.start-nx.lead;
    if(t<need-4)steps.push({k:'free',start:t,end:need});
    const late=t>need+1,s0=Math.max(t,need);
    if(nx.dpa)waitTotal+=Math.min(+nx.s.wait||0,10);
    steps.push({k:nx.dpa?'dpa':nx.type,o:nx,start:s0,mid:nx.start,end:Math.max(t,nx.start)+nx.len,late,lateBy:Math.round(t-need)});
    t=Math.max(t,nx.start)+nx.len;done.add(nx.it.id);fi++;
  }
  if(t<close-4)steps.push({k:'free',start:t,end:close,last:true});
  return{steps,rem:[...rem,...flex.filter(f=>f.noTime)],walkTotal,waitTotal};
}

const $=id=>document.getElementById(id);

}

}
function metaOf(it,s){
  const t=typeOf(it),m=[];
  if(t==='ride'){m.push(`待ち${s.wait}分`);if(normT(s.fixed))m.push(`<span class="hot">${s.fixed} 時間指定</span>`);if(s.first)m.push('<span class="hot">朝イチ</span>');if(s.prio)m.push('<span class="hot">★優先</span>')}
  else if(t==='show'){const ts=timesOf(s);m.push(s.pick?`<span class="hot">${s.pick}の回</span>`:'時刻未入力');if(ts.length>1)m.push(`全${ts.length}回`)}
  else if(t==='meal'){m.push(s.pick?`<span class="hot">${s.pick}</span>`:'時刻未入力');const R=restOf(s);if(R)m.push(esc(R.n));if(s.booked)m.push('予約済み')}
  else if(t==='greet'){m.push(`待ち${s.wait}分`);const w=winsOf(it,s);if(w)m.push(w.map(x=>x.join('–')).join(' / '))}
  else m.push(`${s.dur}分`);
  if(s.after&&byId(s.after))m.push(`${esc(shortName(byId(s.after).name))}のあと`);
  if(s.locked)m.push('<span class="hot">確定</span>');
  return m.map(x=>`<span>${x}</span>`).join('');
}
const shortName=n=>n.replace(/（.*?）/g,'').split(/[：～]/)[0];
const FILTERS=[['all','すべて'],['sel','選択中'],['ride','アトラクション'],['show','ショー'],['meal','食事'],['other','グリーティング・ショップ']];
function renderList(){
  $('chips').innerHTML=FILTERS.map(([k,n])=>`<button type="button" class="chip" data-filter="${k}" aria-pressed="${ui.filter===k}">${n}</button>`).join('');
  const q=ui.q.trim().toLowerCase();
  const items=allItems().filter(it=>{
    const s=st(it),t=typeOf(it);
    if(q&&!it.name.toLowerCase().includes(q))return false;
    if(ui.filter==='sel')return s.sel;
    if(ui.filter==='other')return t==='greet'||t==='shop';
    if(ui.filter!=='all')return t===ui.filter;
    return true;
  });
  const selN=allItems().filter(it=>st(it).sel).length;
  $('pick-count').textContent=`${selN}件を選択中`;
  $('badge-pick').textContent=selN;
  if(!items.length){$('list').innerHTML=`<p class="empty">見つかりませんでした。「＋ 自分で追加」から登録できます。</p>`;return}
  const by={};for(const it of items)(by[st(it).area]=by[st(it).area]||[]).push(it);
  const openAreas=ui.closed||{};
  $('list').innerHTML=Object.entries(AREAS).filter(([k])=>by[k]).map(([k,a])=>{
    const n=by[k].filter(it=>st(it).sel).length;
    return `<details class="area" data-area="${k}"${openAreas[k]&&!q?'':' open'}><summary><span class="dot" style="background:${a.c}"></span>${a.n}<span class="cnt">${n?n+'件選択':''}</span></summary><div class="rows">
    ${by[k].map(it=>{const s=st(it),t=typeOf(it);
      return `<div class="row${s.sel?' on':''}">

/* ================= 貼り付け取り込み ================= */
const keyOf=n=>n.replace(/[\s　・･“”"'「」『』【】！!？?～~〜（）()＆&]/g,'').replace(/環境演出/,'').toLowerCase();
function parsePaste(text){
  const res=[];const T='\\d{1,2}:\\d{2}',RG=`${T}\\s*[-－–〜~]\\s*${T}`;
  const re=new RegExp(`^\\s*((?:${RG}|${T})(?:\\s*[\\/／]\\s*(?:${RG}|${T}))*)\\s*(.+)$`);
  for(const raw of text.split(/\r?\n/)){
    const m=raw.match(re);if(!m)continue;
    let name=m[2].replace(/(エントリー受付対象|ディズニー・プレミアアクセス対象|プライオリティパス対象|※.*)$/g,'').replace(/(エントリー受付対象|ディズニー・プレミアアクセス対象)/g,'').trim();
    if(!name)continue;
    const parts=m[1].split(/[\/／]/).map(x=>x.trim());
    const ranges=parts.filter(p=>/[-－–〜~]/.test(p)).map(p=>p.split(/\s*[-－–〜~]\s*/).map(normT));
    const singles=parts.filter(p=>!/[-－–〜~]/.test(p)).map(normT);
    const k=keyOf(name);
    let it=allItems().find(i=>keyOf(i.name)===k)||allItems().find(i=>{const ik=keyOf(i.name);return ik.length>3&&(ik.includes(k)||k.includes(ik))});
    if(ranges.length){
      if(!it||typeOf(it)!=='greet'){
        it={id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,area:'med',x:AREAS.med.x,y:AREAS.med.y,dur:5,wait:30,type:'greet',custom:true,est:true,wins:ranges};
        state.custom.push(it);res.push({cls:'new',msg:`新規：${esc(name)}（${ranges.map(r=>r.join('–')).join(' / ')}）→ 場所を確認してね`});
      }else{st(it).wins=ranges;res.push({cls:'ok',msg:`更新：${esc(it.name)}（${ranges.map(r=>r.join('–')).join(' / ')}）`})}
    }else if(singles.length){
      if(!it||typeOf(it)!=='show'){
        it={id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,area:'med',x:AREAS.med.x,y:AREAS.med.y,dur:30,type:'show',custom:true,est:true,times:singles};
        state.custom.push(it);st(it);res.push({cls:'new',msg:`新規：${esc(name)}（${singles.join(' / ')}）→ 場所を確認してね`});
      }else{const s=st(it);if(s.locked&&!singles.includes(s.pick)){res.push({cls:'',msg:`確定済みのため変更なし：${esc(it.name)}`});continue}
        s.times=singles.join(',');if(!singles.includes(s.pick))s.pick=singles[0];res.push({cls:'ok',msg:`更新：${esc(it.name)}（${singles.join(' / ')}）`})}
    }
  }
  return res;
}

/* ================= バックアップ ================= */
function compactItems(){
  const out={};
  for(const[id,s]of Object.entries(state.items)){
    const it=byId(id);if(!it)continue;const o={};
    for(const[k,v]of Object.entries(s)){
      if(v===false||v===''||v==null)continue;
      if(k==='wait'&&v===(it.wait??0))continue;
      if(k==='dur'&&v===it.dur)continue;
      if(k==='area'&&v===it.area)continue;
      if(k==='times'&&v===(it.times||[]).join(','))continue;
      if(k==='pick'&&v===((it.times||[])[0]||''))continue;
      o[k]=v;
    }
    if(Object.keys(o).length)out[id]=o;
  }
  return out;
}
function exportCode(){return 'SEAPLAN:'+btoa(unescape(encodeURIComponent(JSON.stringify({v:13,settings:state.settings,items:compactItems(),custom:state.custom}))))}
function importCode(code){
  const m=code.trim().match(/^SEAPLAN:([A-Za-z0-9+/=\s]+)$/);if(!m)throw new Error('format');
  const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s/g,'')))));
  if(!o.settings||!o.items)throw new Error('data');
  state={v:13,settings:o.settings,items:o.items,custom:o.custom||[]};
}

}

  if(b=g('.tabs button')){ui.tab=b.dataset.tab;renderHeader();save();window.scrollTo({top:0});return}
  if(b=g('[data-filter]')){ui.filter=b.dataset.filter;renderList();save();return}
  if(b=g('[data-tog]')){const it=byId(b.dataset.tog),s=st(it);if(s.locked){toast('確定中の予定です。詳細から確定を外してね');return}s.sel=!s.sel;renderList();renderPlan();toast(s.sel?'プランに入れました':'プランから外しました');return}
  if(b=g('[data-open]')){openSheet('item',b.dataset.open);return}
  if(b=g('#sheet [data-pick]')){const s=st(byId(sheet.id));s.pick=b.dataset.pick;s.sel=true;renderSheet();renderList();renderPlan();return}
  if(b=g('#sheet button[data-k="sel"]')){const s=st(byId(sheet.id));s.sel=b.dataset.v==='true';renderSheet();renderList();renderPlan();return}
  if(b=g('[data-del]')){state.custom=state.custom.filter(c=>c.id!==b.dataset.del);delete state.items[b.dataset.del];closeSheet();renderAll();toast('削除しました');return}
  if(g('#btn-settings')){openSheet('settings');return}
  if(g('#btn-paste')){openSheet('paste');return}
  if(g('#btn-add')){openSheet('add');return}
  if(g('#btn-parse')){const txt=$('paste-text').value;const r=parsePaste(txt);sheet.text=txt;sheet.results=r.length?r:[{cls:'',msg:'時刻と名前の行が見つかりませんでした。「10:35 / 14:00 ショー名」の形の行を含めて貼り付けてください。'}];renderSheet();renderAll();if(r.length)toast(`${r.length}件を取り込みました`);return}
  if(g('#c-add')){
    const name=$('c-name').value.trim();if(!name){toast('名前を入れてね');return}
    const area=$('c-area').value,a=AREAS[area],type=$('c-type').value;
    const times=$('c-times').value.split(/[,、\s]+/).map(normT).filter(Boolean);
    const it={id:'c'+Date.now(),name,area,type,custom:true,x:a.x+(Math.random()*80-40),y:a.y+(Math.random()*80-40),dur:+$('c-dur').value||20,wait:+$('c-wait').value||0};
    if(type==='show'||type==='meal')it.times=times;
    if(type==='greet')it.wins=[[state.settings.open,state.settings.close]];
    state.custom.push(it);state.items[it.id]={sel:true,...(type==='ride'&&times[0]?{fixed:times[0]}:{})};
    renderAll();openSheet('item',it.id);toast('追加しました');return;
  }
  if(g('#btn-export')){copyText(exportCode(),'コードをコピーしました');return}
  if(g('#btn-import-open')){$('import-box').hidden=false;$('import-text').focus();return}
  if(g('#btn-import')){try{importCode($('import-text').value);renderAll();closeSheet();toast('プランを読み込みました')}catch(err){toast('コードを読み込めませんでした。全部コピーできているか確認してね')}return}
  if(g('#btn-sample')){state=defaults();renderAll();closeSheet();toast('サンプルプランにしました');return}
  if(g('#btn-clear')){if(!sheet.confirmClear){sheet.confirmClear=true;renderSheet();return}for(const s of Object.values(state.items)){s.sel=false;s.locked=false}renderAll();closeSheet();toast('選択を全部外しました');return}
  if(g('#btn-copy')){
    const lines=[`シー周遊プラン ${dateLabel()}`];
    for(const s of last.steps){
      if(s.k==='walk')lines.push(`　↓ 徒歩${Math.round(s.d)}m（約${Math.max(1,Math.round(s.m))}分）`);
      else if(s.k==='free')lines.push(`${fmt(s.start)} 自由時間（${Math.round(s.end-s.start)}分）`);
      else{const R=restOf(s.o.s);lines.push(`${fmt(s.start)} ${s.o.it.name}${R?'（'+R.n+'）':''}${s.k==='show'?`（開演${fmt(s.mid)}）`:s.k==='ride'||s.k==='greet'?`（待ち${s.o.s.wait}分）`:s.k==='dpa'?`（時間指定${fmt(s.mid)}）`:''}${s.o.s.locked?' ✓確定':''}`)}
    }
    lines.push(`歩く距離 約${(last.walkTotal/1000).toFixed(1)}km`);
    copyText(lines.join('\n'),'プランをコピーしました');return;
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details.area'))return;ui.closed=ui.closed||{};ui.closed[d.dataset.area]=!d.open},true);
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.set){const k=el.dataset.set;state.settings[k]=el.type==='number'||k==='speed'?+el.value:el.value;renderAll();return}
  if(!el.dataset.k||!sheet||sheet.kind!=='item')return;
  const it=byId(sheet.id),s=st(it),k=el.dataset.k;
  if(el.type==='checkbox'){
    s[k]=el.checked;
    if(k==='locked'&&el.checked)s.sel=true;
    if(k==='first'&&el.checked)allItems().forEach(o=>{if(o.id!==it.id)st(o).first=false});
  }else if(el.type==='number')s[k]=Math.max(0,+el.value||0);
  else if(k==='times'){s.times=el.value;const ts=timesOf(s);if(!ts.includes(s.pick))s.pick=ts[0]||''}
  else if(k==='fixed'||k==='pick'){s[k]=normT(el.value);if(s[k])s.sel=true;if(!s[k])s.locked=false}
  else s[k]=el.value;
  renderSheet();renderList();renderPlan();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2000)}
setInterval(()=>{if(isToday())renderPlan()},60000);

renderAll();
</script>
</body>
</html>
